<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document Uisng UI </title>
</head>
<body> 
    <h1>Rock-Paper-Scissors.</h1>
    <div class="choices">
        <button onclick="playGame('rock')" id="rock">👊</button>
        <button onclick="playGame('paper')" id="paper">🫱</button>
        <button onclick="playGame('scissors')" id="scissors">✌️</button>
    </div>
    <div id="computerDisplay">Computer:</div>
    <div id="playerDisplay">You:</div>
    <div id="resultDisplayPlate">
          <div id="resultDisplay"></div>
    </div>
    <div class="scoreDisplay">Player Score:
    <span id="playerScoreDisplay">0</span>
    </div>
    <div class="scoreDisplay">Computer Score:
     <span id="computerScoreDisplay">0</span>
    </div>
    <footer id="footer">By Teklalign T. for The Odin Project ©️</footer>
    <script defer src="script.js"></script>
</body>
</html>
